name: Build and Deploy

on:
  push:
    branches: [ master ]          # 你的分支是 master
  pull_request:
    branches: [ master ]
  workflow_dispatch:              # 手动触发

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    name: Astro Check (Deno)
    steps:
      - name: Checkout source repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v1.x      # 可指定具体版本，如 v2.0

      - name: Install dependencies (caching)
        run: deno install         # 会根据 deno.json 或 package.json 安装

      - name: Run Astro Check
        run: deno task check      # 前提是你的 deno.json 里有 "check" 脚本

  build-and-deploy:
    runs-on: ubuntu-latest
    name: Build & Deploy to Pages
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write             # 用于推送至目标仓库
    steps:
      - name: Checkout source repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v1.x

      - name: Install dependencies
        run: deno install

      - name: Build site
        run: deno task build       # 你的构建脚本（如 "astro build"）

      - name: Checkout target repository (msqy-h.github.io)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: msqy-h/msqy-h.github.io
          token: ${{ secrets.PERSONAL_TOKEN }}
          path: target_repo
          fetch-depth: 0

      - name: Deploy dist to target repo
        run: |
          cd target_repo
          git rm -rf .
          cp -r ../dist/. .
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Deploy from ${{ github.repository }}@${{ github.sha }}"
          git push