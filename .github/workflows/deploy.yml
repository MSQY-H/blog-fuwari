name: Build and Deploy

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    name: Astro Check (Deno)
    steps:
      - name: Checkout source repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v1.x      # 或者 v2.x，看你需要

      - name: Run Astro Check
        run: deno task check      # 确保 deno.json 中有 "check" 任务

  build-and-deploy:
    runs-on: ubuntu-latest
    name: Build & Deploy to Pages
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    steps:
      - name: Checkout source repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v1.x

      - name: Build site
        run: deno task build       # 你的构建任务

      - name: Checkout target repository (msqy-h.github.io)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: msqy-h/msqy-h.github.io
          token: ${{ secrets.PERSONAL_TOKEN }}
          path: target_repo
          fetch-depth: 0

      - name: Deploy dist to target repo
        run: |
          cd target_repo
          git rm -rf .
          cp -r ../dist/. .
          git config user.name "github-actions[bot]"
          git config.user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Deploy from ${{ github.repository }}@${{ github.sha }}"
          git push