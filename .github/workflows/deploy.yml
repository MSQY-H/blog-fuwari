name: Build and Deploy

on:
  push:
    branches: [ master ]          # 你的默认分支是 master
  pull_request:
    branches: [ master ]          # PR 只触发 check，不部署
  workflow_dispatch:              # 支持手动触发

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------- 类型检查（不会阻止部署） ----------
  check:
    strategy:
      matrix:
        node: [ 22, 23 ]          # 测试两个 Node 版本
    runs-on: ubuntu-latest
    name: Astro Check (Node ${{ matrix.node }})
    steps:
      - name: Checkout source repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e # v4.3.0
        with:
          node-version: ${{ matrix.node }}

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddca # v4.1.0
        with:
          run_install: false

      - name: Install dependencies (allow missing lockfile)
        run: pnpm install --no-frozen-lockfile

      - name: Run Astro Check
        continue-on-error: true   # 即使有类型错误也不中断工作流
        run: pnpm astro check

  # ---------- 构建并部署到 Pages 仓库 ----------
  build-and-deploy:
    runs-on: ubuntu-latest
    name: Build & Deploy to msqy-h.github.io
    # 只在 push 到 master 或手动触发时执行（PR 不触发）
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write            # 推送目标仓库需要写入权限

    steps:
      - name: Checkout source repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js (LTS)
        uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e # v4.3.0
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddca # v4.1.0
        with:
          run_install: false

      - name: Install dependencies (allow missing lockfile)
        run: pnpm install --no-frozen-lockfile

      - name: Build site
        run: pnpm astro build

      - name: Checkout target repository (msqy-h.github.io)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: msqy-h/msqy-h.github.io
          token: ${{ secrets.PERSONAL_TOKEN }}
          path: target_repo
          fetch-depth: 0          # 获取完整历史以便提交

      - name: Deploy dist to target repo
        run: |
          cd target_repo
          git rm -rf .            # 清空工作区（保留 .git）
          cp -r ../dist/. .      # 复制新构建产物
          touch .nojekyll        # 👈 关键：禁用 Jekyll 构建
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Deploy from ${{ github.repository }}@${{ github.sha }}"
          git push