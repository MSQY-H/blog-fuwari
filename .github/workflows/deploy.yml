name: Build and Deploy

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ----- Check Job（也注入环境变量，避免 astro check 因缺变量报错）-----
  check:
    strategy:
      matrix:
        node: [ 22, 23 ]
    runs-on: ubuntu-latest
    name: Astro Check (Node ${{ matrix.node }})
    steps:
      - name: Checkout source repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Install dependencies (allow missing lockfile)
        run: pnpm install --no-frozen-lockfile

      - name: Run Astro Check
        continue-on-error: true   # 允许失败，但变量已注入，日志干净
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
          INDEXNOW_ENDPOINT: ${{ secrets.INDEXNOW_ENDPOINT }}
        run: pnpm astro check

  # ----- Build & Deploy Job -----
  build-and-deploy:
    runs-on: ubuntu-latest
    name: Build & Deploy to msqy-h.github.io
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    steps:
      - name: Checkout source repo
        uses: actions/checkout@v4

      - name: Setup Node.js (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Install dependencies (allow missing lockfile)
        run: pnpm install --no-frozen-lockfile

      # ----- 生成 IndexNow 验证文件（文件名=内容=密钥）-----
      - name: Create IndexNow key file
        run: echo "${{ secrets.INDEXNOW_KEY }}" > public/${{ secrets.INDEXNOW_KEY }}.txt

      # ----- 调试：检查环境变量是否存在（不打印值）-----
      - name: Debug Secrets (Check existence only)
        run: |
          if [ -z "$INDEXNOW_KEY" ]; then
            echo "❌ INDEXNOW_KEY is EMPTY"
          else
            echo "✅ INDEXNOW_KEY is set (length: ${#INDEXNOW_KEY})"
          fi
          if [ -z "$INDEXNOW_ENDPOINT" ]; then
            echo "❌ INDEXNOW_ENDPOINT is EMPTY"
          else
            echo "✅ INDEXNOW_ENDPOINT is set (length: ${#INDEXNOW_ENDPOINT})"
          fi
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
          INDEXNOW_ENDPOINT: ${{ secrets.INDEXNOW_ENDPOINT }}

      # ----- 构建（同时注入两个环境变量）-----
      - name: Build site
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
          INDEXNOW_ENDPOINT: ${{ secrets.INDEXNOW_ENDPOINT }}
        run: pnpm build

      # ----- 部署到目标仓库 -----
      - name: Checkout target repository (msqy-h.github.io)
        uses: actions/checkout@v4
        with:
          repository: msqy-h/msqy-h.github.io
          token: ${{ secrets.PERSONAL_TOKEN }}
          path: target_repo
          fetch-depth: 0

      - name: Deploy dist to target repo
        run: |
          cd target_repo
          git rm -rf .
          cp -r ../dist/. .
          touch .nojekyll
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Deploy from ${{ github.repository }}@${{ github.sha }}"
          git push