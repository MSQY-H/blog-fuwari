name: Build and Deploy

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    strategy:
      matrix:
        node: [ 22, 23 ]            # 保留矩阵测试多个 Node 版本
    runs-on: ubuntu-latest
    name: Astro Check (Node ${{ matrix.node }})
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e # v4.3.0
        with:
          node-version: ${{ matrix.node }}

      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          run_install: false

      - name: Install dependencies (ignore lockfile)
        run: pnpm install --no-frozen-lockfile

      - name: Run Astro Check
        run: pnpm astro check

  build-and-deploy:
    runs-on: ubuntu-latest
    name: Build & Deploy to Pages
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    steps:
      - name: Checkout source repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js (LTS)
        uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e # v4.3.0
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          run_install: false

      - name: Install dependencies (ignore lockfile)
        run: pnpm install --no-frozen-lockfile

      - name: Build site
        run: pnpm astro build

      - name: Checkout target repository (msqy-h.github.io)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: msqy-h/msqy-h.github.io
          token: ${{ secrets.PERSONAL_TOKEN }}
          path: target_repo
          fetch-depth: 0

      - name: Deploy dist to target repo
        run: |
          cd target_repo
          git rm -rf .
          cp -r ../dist/. .
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Deploy from ${{ github.repository }}@${{ github.sha }}"
          git push