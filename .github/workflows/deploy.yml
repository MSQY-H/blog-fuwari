name: Build and Deploy

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    strategy:
      matrix:
        node: [ 22, 23 ]
    runs-on: ubuntu-latest
    name: Astro Check (Node ${{ matrix.node }})
    steps:
      - name: Checkout source repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Install dependencies (allow missing lockfile)
        run: pnpm install --no-frozen-lockfile

      - name: Run Astro Check
        continue-on-error: true
        run: pnpm astro check

  build-and-deploy:
    runs-on: ubuntu-latest
    name: Build & Deploy to msqy-h.github.io
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    steps:
      - name: Checkout source repo
        uses: actions/checkout@v4

      - name: Setup Node.js (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Install dependencies (allow missing lockfile)
        run: pnpm install --no-frozen-lockfile

      - name: Build site
        run: pnpm build

      - name: Checkout target repository (msqy-h.github.io)
        uses: actions/checkout@v4
        with:
          repository: msqy-h/msqy-h.github.io
          token: ${{ secrets.PERSONAL_TOKEN }}
          path: target_repo
          fetch-depth: 0

      - name: Deploy dist to target repo
        run: |
          cd target_repo
          git rm -rf .
          cp -r ../dist/. .
          touch .nojekyll
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Deploy from ${{ github.repository }}@${{ github.sha }}"
          git push