name: Build and Deploy

on:
  push:
    branches: [ master ]          # 改为 master
  pull_request:
    branches: [ master ]          # 改为 master
  workflow_dispatch:              # 手动触发

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    strategy:
      matrix:
        node: [ 22, 23 ]
    runs-on: ubuntu-latest
    name: Astro Check (Node ${{ matrix.node }})
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e # v4.3.0
        with:
          node-version: ${{ matrix.node }}

      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Astro Check
        run: pnpm astro check

  build-and-deploy:
    runs-on: ubuntu-latest
    name: Build & Deploy to Pages
    # 仅在 push 到 master 或手动触发时部署（PR 不触发部署）
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write            # 用于推送至目标仓库
    steps:
      - name: Checkout source repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js (LTS)
        uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e # v4.3.0
        with:
          node-version: 22       # 部署只需一个版本，用 LTS

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build site
        run: pnpm astro build

      - name: Checkout target repository (msqy-h.github.io)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: msqy-h/msqy-h.github.io
          token: ${{ secrets.PERSONAL_TOKEN }}
          path: target_repo
          fetch-depth: 0

      - name: Deploy dist to target repo
        run: |
          cd target_repo
          git rm -rf .
          cp -r ../dist/. .
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Deploy from ${{ github.repository }}@${{ github.sha }}"
          git push